<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQL 进阶训练营 · 从会写到会分析</title>
<style>
:root{--bg:#f4f5f0;--card:#fff;--ink:#172b35;--muted:#60727b;--line:#dce4e2;--green:#166b59;--mint:#e8f5ee;--red:#a72d36;--nav:#102d35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:7px 13px}button:hover{border-color:var(--green);background:var(--mint)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e4af44;outline-offset:3px}header{background:var(--nav);color:#fff;padding:25px max(20px,calc((100vw - 1180px)/2)) 0}.brand{font-size:12px;letter-spacing:3px;color:#a8d4c4}.hero{display:flex;justify-content:space-between;align-items:center;gap:30px;padding:14px 0 24px}h1{font-size:clamp(25px,4vw,37px);line-height:1.35;margin:5px 0 12px}header p{color:#c1d4d6;margin:0;max-width:690px}.badge{border:1px solid #507077;border-radius:30px;padding:5px 12px;font-size:12px;white-space:nowrap}.tabs{display:flex;gap:6px}.tabs button{white-space:nowrap;border:0;border-radius:10px 10px 0 0;padding:12px 20px;background:transparent;color:#bed1d2}.tabs button.active{background:var(--bg);color:var(--green);font-weight:700}main{max-width:1180px;margin:0 auto;padding:26px 20px 50px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.metric,.panel,.question,.lesson,.case{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.metric b{font-size:27px;display:block;line-height:1.4}.muted,.metric span{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}.sidebar{align-self:start;position:sticky;top:16px}.sidebar h2{font-size:16px;margin:0 0 12px}.topic{display:block;width:100%;text-align:left;border:0;border-radius:8px;margin:3px 0;font-size:13px;padding:6px 9px}.topic.active{background:var(--mint);color:var(--green);font-weight:bold}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}input[type=search]{min-width:150px;flex:1;width:100%}textarea{display:block;width:100%;min-height:100px;font:14px/1.65 Consolas,monospace;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #65a99a;outline-offset:1px}.question{margin:12px 0;scroll-margin-top:16px}.qmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px}.chip{border-radius:20px;padding:2px 10px;background:#edf3f3;color:#31585d}.qmeta button{margin-left:auto;padding:2px 9px;font-size:12px}.question h3{font-size:16px;font-weight:600;margin:14px 0}.opt{display:flex;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer}.opt:has(input:checked){background:#eff7f4;border-color:#529a87}.opt.correct{border-color:#57a57c;background:#edf8f0}.opt.incorrect{border-color:#d89898;background:#fff1f1}.opt input{accent-color:var(--green);flex-shrink:0}.feedback{padding:12px 15px;border-left:3px solid var(--green);background:#eef8f2;margin-top:12px;border-radius:0 8px 8px 0}.feedback.bad{border-color:var(--red);background:#fff3f2}.feedback p{margin:4px 0}.question .actions{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}code,pre{font-family:Consolas,monospace}code{background:#edf1ee;padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#132f37;color:#d7efe7;padding:16px;border-radius:10px;font-size:13px;line-height:1.7}.sheet{display:flex;gap:5px;flex-wrap:wrap;max-height:200px;overflow:auto;margin-top:12px}.sheet button{font-size:11px;padding:3px 6px;min-width:31px}.sheet .done{background:#e7eef8}.sheet .right{background:#dff2e5;color:#16633b}.sheet .wrong{background:#fae2df;color:#922a34}.sheet .current{outline:2px solid #87a5a5}.paging{display:flex;align-items:center;justify-content:space-between;margin:20px 0;gap:8px}.empty{text-align:center;padding:40px;background:white;border-radius:12px}.result{background:#e7f3ed;border:1px solid #a4ccbb;padding:20px;border-radius:12px;margin:12px 0}.result h2{margin:0}.progress{height:7px;border-radius:9px;background:#e2e9e5;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--green)}.roadmap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lesson h2,.case h2{font-size:20px;margin:8px 0}.lesson p{margin:10px 0}.lesson ul{padding-left:20px}.lesson .step{color:var(--green);font-size:12px;letter-spacing:1px}.case{margin-bottom:18px}.case details{border-top:1px solid var(--line);padding:12px 0;margin-top:12px}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}.tablewrap{overflow-x:auto}.notice{padding:12px 16px;background:#fff5db;border:1px solid #ead7a4;border-radius:10px;margin-bottom:16px;font-size:13px}#status{font-size:13px;color:var(--muted);min-height:24px;margin-bottom:8px}footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}.reviewgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.reviewrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.tools{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:780px){.layout{grid-template-columns:1fr}.sidebar{position:static}.sidebar #topics{display:flex;flex-wrap:wrap}.topic{width:auto}.hero{display:block}.badge{display:inline-block;margin-top:15px}.stats{grid-template-columns:repeat(2,1fr)}.roadmap,.reviewgrid{grid-template-columns:1fr}.tabs button{padding:11px 8px;flex:1;font-size:13px}.sheet{max-height:105px}main{padding:18px 12px}.question{padding:15px}header{padding:20px 16px 0}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body>
<header><div class="brand">SQL / LEARNING LAB</div><div class="hero"><div><h1>从写出 SQL，到理解数据。</h1><p>基础 → 查询 → 联表 → 窗口 → 性能与事务。先理解，再练习，最后用真实业务检验自己。</p></div><span class="badge">MySQL 8.0.16+ · 离线可学</span></div><nav class="tabs" aria-label="学习区域"><button data-tab="learn">学习路线</button><button data-tab="quiz" class="active">题库训练</button><button data-tab="lab">业务实战</button><button data-tab="review">复习报告</button></nav></header>
<main><div class="stats"><div class="metric"><span>训练题目</span><b id="total"></b></div><div class="metric"><span>已提交 / 已填写</span><b id="answered"></b></div><div class="metric"><span>当前答对率 · 已提交题</span><b id="accuracy"></b></div><div class="metric"><span>累计学习时间</span><b id="timer">00:00</b></div></div><div id="status" role="status" aria-live="polite"></div>
<section id="learn" hidden></section>
<section id="quiz"><div class="layout"><aside class="panel sidebar"><h2>知识地图</h2><div id="topics"></div><details><summary>当前题单导航</summary><div id="sheet" class="sheet"></div></details></aside><div><div class="toolbar"><select id="mode" aria-label="答题模式"><option value="practice">练习 · 提交后解析</option><option value="exam">考试 · 交卷后解析</option></select><select id="filter" aria-label="题目筛选"><option value="all">全部题目</option><option value="unanswered">未提交</option><option value="wrong">当前错题</option><option value="star">已收藏</option><option value="due">到期复习</option></select><input type="search" id="search" placeholder="搜索题干 / 知识点" aria-label="搜索题目"></div><div class="toolbar"><button class="primary" id="submit">提交当前题单</button><button id="shuffle">打乱题序</button><button id="retry">重练当前题单</button><span class="muted" id="range"></span></div><div class="notice">多选题选完再提交。命令题仅做保守的参考写法匹配，不执行 SQL；未匹配不代表语义一定错误，请对照解析或到 MySQL 验证。</div><div id="result" hidden></div><div id="list"></div><div class="paging"><button id="prev">← 上一页</button><span id="pageinfo"></span><button id="next">下一页 →</button></div></div></div></section>
<section id="lab" hidden></section><section id="review" hidden></section>
<div class="tools"><button id="export">导出学习记录</button><button id="import">导入学习记录</button><input type="file" id="importfile" accept="application/json,.json" hidden><button id="reset">清空新版学习记录</button><span class="muted">记录保存在当前浏览器；定期导出可跨设备继续。</span></div></main><footer>做完题不等于精通。能解释结果、处理边界情况、验证执行计划，才是进阶的开始。</footer>
<script>
const BANK=__BANK__;
const KEY='mysqlLearning.v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=s=>String(s).replace(/<[^>]*>/g,'');
BANK.forEach((q,i)=>{q.id=i;if(q.type==='j')q.o=['正确','错误'];});
const blank=()=>({version:2,answers:{},graded:{},stars:{},history:{},drafts:{},cases:{},seconds:0});
function validate(raw){
 if(!raw||raw.version!==2||typeof raw!=='object')throw Error('记录版本不支持');
 const out=blank();
 for(const field of ['answers','graded','stars','history','drafts','cases'])if(!raw[field]||typeof raw[field]!=='object'||Array.isArray(raw[field]))throw Error('记录格式错误');
 BANK.forEach(q=>{const k=q.id,a=raw.answers[k];if(q.type==='f'&&typeof a==='string'&&a.length<=10000)out.answers[k]=a;else if(q.type==='m'&&Array.isArray(a)&&a.every(x=>Number.isInteger(x)&&x>=0&&x<q.o.length))out.answers[k]=[...new Set(a)];else if(q.type!=='f'&&q.type!=='m'&&Number.isInteger(a)&&a>=0&&a<q.o.length)out.answers[k]=a;
 if(raw.graded[k]===true&&out.answers[k]!==undefined)out.graded[k]=true;if(raw.stars[k]===true)out.stars[k]=true;
 const h=raw.history[k];if(h&&Number.isInteger(h.attempts)&&h.attempts>=0&&Number.isInteger(h.errors)&&h.errors>=0&&h.errors<=h.attempts&&Number.isInteger(h.streak)&&h.streak>=0&&h.streak<=h.attempts&&Number.isFinite(h.due)&&h.due>=0)out.history[k]={attempts:h.attempts,errors:h.errors,streak:h.streak,due:h.due};});
 for(let i=0;i<8;i++){if(typeof raw.drafts[i]==='string'&&raw.drafts[i].length<=20000)out.drafts[i]=raw.drafts[i];if(raw.cases[i]===true)out.cases[i]=true;}
 out.seconds=Number.isFinite(raw.seconds)&&raw.seconds>=0?Math.floor(raw.seconds):0;return out;
}
let state=blank(),storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch{storageOK=false;}
let topic='all',filter='all',query='',page=0,mode='practice',tab='quiz',examDone=false;
let order=BANK.map(q=>q.id),activeIds=[...order];const size=12;
function status(t){$('#status').textContent=t;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;status('浏览器未能保存记录，请使用“导出学习记录”备份当前进度。');}}
// Preserve quoted literal contents and statement boundaries; never accept a substring.
function norm(value){const tokens=String(value).trim().match(/'(?:''|\\.|[^'\\])*'|"(?:""|\\.|[^"\\])*"|`(?:``|[^`])*`|[\p{L}\p{N}_$]+|>=|<=|<>|!=|:=|\S/gu)||[];if(tokens.at(-1)===';')tokens.pop();return JSON.stringify(tokens.map(t=>/^["'`]/.test(t)?t:t.toLowerCase()));}
function answered(q){const a=state.answers[q.id];return q.type==='f'?typeof a==='string'&&a.trim().length>0:q.type==='m'?Array.isArray(a)&&a.length>0:Number.isInteger(a);}
function right(q){if(!answered(q))return false;const a=state.answers[q.id];if(q.type==='f')return q.a.some(v=>norm(v)===norm(a));if(q.type==='m')return a.length===q.a.length&&q.a.every(v=>a.includes(v));return a===q.a[0];}
function visibleGrade(q){return !!state.graded[q.id]&&(mode!=='exam'||examDone);}
function updateStats(){const graded=BANK.filter(q=>state.graded[q.id]);$('#total').textContent=BANK.length;$('#answered').textContent=graded.length+' / '+BANK.filter(answered).length;$('#accuracy').textContent=graded.length?Math.round(100*graded.filter(right).length/graded.length)+'%':'—';const t=state.seconds;$('#timer').textContent=String(Math.floor(t/3600)).padStart(2,'0')+':'+String(Math.floor(t/60)%60).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function applyFilter(){examDone=false;activeIds=order.filter(i=>{const q=BANK[i];return(topic==='all'||q.topic===topic)&&(!query||plain(q.q+' '+q.topic).toLowerCase().includes(query))&&(filter==='all'||filter==='unanswered'&&!state.graded[i]||filter==='wrong'&&state.graded[i]&&!right(q)||filter==='star'&&state.stars[i]||filter==='due'&&state.history[i]&&state.history[i].due<=Date.now());});page=0;$('#result').hidden=true;render();}
function topics(){const all=['all',...new Set(BANK.map(q=>q.topic))];$('#topics').innerHTML=all.map(t=>`<button class="topic ${topic===t?'active':''}" data-topic="${esc(t)}" aria-pressed="${topic===t}">${t==='all'?'全部知识点':esc(t)} <span class="muted">${t==='all'?BANK.length:BANK.filter(q=>q.topic===t).length}</span></button>`).join('');$('#topics').querySelectorAll('button').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;applyFilter();});}
function sheet(){const panel=$('#sheet');panel.innerHTML=activeIds.map((id,n)=>`<button data-id="${id}" title="第 ${id+1} 题" class="${visibleGrade(BANK[id])?(right(BANK[id])?'right':'wrong'):answered(BANK[id])?'done':''} ${Math.floor(n/size)===page?'current':''}">${id+1}</button>`).join('');panel.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.id);page=Math.floor(activeIds.indexOf(i)/size);render();document.getElementById('q'+i)?.scrollIntoView({block:'start'});});}
function feedback(q){if(!visibleGrade(q))return '';const ok=right(q);const a=q.type==='f'?`<code>${esc(q.a[0])}</code>`:q.a.map(i=>`${String.fromCharCode(65+i)}. ${esc(q.o[i])}`).join('；');return `<div class="feedback ${ok?'':'bad'}"><strong>${ok?'✓ '+(q.type==='f'?'匹配参考答案':'回答正确'):q.type==='f'?'待核对：未匹配参考写法':'需要再练习'}</strong><p>参考答案：${a}</p><p>${q.e}</p>${q.type==='f'?'<p class="muted">这不是 SQL 引擎判定。等价写法请自行运行核验；统计中仅将匹配参考答案记为答对。</p>':''}</div>`;}
function card(q){const graded=visibleGrade(q),a=state.answers[q.id],locked=mode==='exam'&&examDone;return `<article class="question" id="q${q.id}"><div class="qmeta"><span class="chip">#${q.id+1}</span><span>${esc(q.topic)}</span><span class="muted">${({s:'单选',m:'多选',j:'判断',f:'命令默写'})[q.type]}</span><button data-star="${q.id}" aria-pressed="${!!state.stars[q.id]}">${state.stars[q.id]?'★ 已收藏':'☆ 收藏'}</button></div><h3>${q.q}</h3>${q.type==='f'?`<textarea data-answer="${q.id}" aria-label="第 ${q.id+1} 题 SQL 答案" spellcheck="false" placeholder="输入完整 SQL；保留字符串引号" ${locked?'disabled':''}>${esc(a||'')}</textarea>`:q.o.map((o,i)=>`<label class="opt ${graded&&q.a.includes(i)?'correct':graded&&(Array.isArray(a)?a.includes(i):a===i)?'incorrect':''}"><input data-answer="${q.id}" type="${q.type==='m'?'checkbox':'radio'}" name="q${q.id}" value="${i}" ${(Array.isArray(a)?a.includes(i):a===i)?'checked':''} ${locked?'disabled':''}><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')}<div class="actions">${mode==='practice'?`<button data-check="${q.id}">${state.graded[q.id]?'已提交 · 修改后可重判':'提交本题'}</button>`:'<span class="muted">考试模式：统一交卷后显示解析。</span>'}</div>${feedback(q)}</article>`;}
function render(){topics();const max=Math.max(1,Math.ceil(activeIds.length/size));page=Math.min(page,max-1);$('#list').innerHTML=activeIds.slice(page*size,(page+1)*size).map(i=>card(BANK[i])).join('')||'<div class="empty">当前没有符合条件的题目。试试其他知识点或筛选。</div>';$('#range').textContent=`本题单 ${activeIds.length} 题`;$('#pageinfo').textContent=`${page+1} / ${max} 页`;$('#prev').disabled=page===0;$('#next').disabled=page===max-1;$('#submit').disabled=!activeIds.length||mode==='exam'&&examDone;
 $('#list').querySelectorAll('[data-answer]').forEach(el=>{el.addEventListener(el.tagName==='TEXTAREA'?'input':'change',()=>{const id=+el.dataset.answer,q=BANK[id];state.answers[id]=q.type==='f'?el.value:q.type==='m'?[...document.getElementsByName('q'+id)].filter(x=>x.checked).map(x=>+x.value):+el.value;delete state.graded[id];$('#result').hidden=true;const c=$('#q'+id);c.querySelector('.feedback')?.remove();c.querySelectorAll('.correct,.incorrect').forEach(x=>x.classList.remove('correct','incorrect'));const btn=c.querySelector('[data-check]');if(btn)btn.textContent='提交本题';save();updateStats();sheet();});});
 $('#list').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const q=BANK[+b.dataset.check];if(!answered(q)){status('请先作答，再提交本题。');return;}grade(q);save();render();status('已保存本题结果。修改答案后可重新提交。');});
 $('#list').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const id=+b.dataset.star;state.stars[id]=!state.stars[id];save();b.textContent=state.stars[id]?'★ 已收藏':'☆ 收藏';b.setAttribute('aria-pressed',String(state.stars[id]));});sheet();updateStats();}
function grade(q){if(state.graded[q.id]||!answered(q))return;state.graded[q.id]=true;const old=state.history[q.id]||{attempts:0,errors:0,streak:0};const ok=right(q),streak=ok?old.streak+1:0;state.history[q.id]={attempts:old.attempts+1,errors:old.errors+(ok?0:1),streak,due:Date.now()+(ok?[1,3,7,14][Math.min(streak-1,3)]:1)*86400000};}
function submit(){if(!activeIds.length)return;activeIds.forEach(i=>grade(BANK[i]));examDone=mode==='exam';save();render();const done=activeIds.filter(i=>answered(BANK[i])).length,correct=activeIds.filter(i=>right(BANK[i])).length;const r=$('#result');r.hidden=false;r.className='result';r.innerHTML=`<h2>${correct} / ${activeIds.length} 题符合参考答案</h2><p>已作答 ${done} 题，未答 ${activeIds.length-done} 题。题单得分 ${Math.round(correct/activeIds.length*100)}%。</p><p>建议：先解释错因，再到“业务实战”写完整查询。未作答题不计入错题记录。</p>`;r.scrollIntoView({block:'start'});}
function resetView(){topic='all';filter='all';query='';$('#filter').value='all';$('#search').value='';order=BANK.map(q=>q.id);examDone=false;applyFilter();}
$('#submit').onclick=submit;$('#prev').onclick=()=>{page--;render();$('#quiz').scrollIntoView();};$('#next').onclick=()=>{page++;render();$('#quiz').scrollIntoView();};$('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();applyFilter();};$('#filter').onchange=e=>{filter=e.target.value;applyFilter();};
$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}applyFilter();};
$('#retry').onclick=()=>{if(!activeIds.length||!confirm('清除当前题单的答案，开始重练？收藏与历史错题次数会保留。'))return;activeIds.forEach(i=>{delete state.answers[i];delete state.graded[i];});examDone=false;save();$('#result').hidden=true;render();status('已开始重练当前题单，历史复习记录已保留。');};
$('#mode').onchange=e=>{mode=e.target.value;examDone=false;$('#result').hidden=true;render();status(mode==='exam'?'考试模式已隐藏解析。如需全新考试，请点击“重练当前题单”。':'已切回练习模式。');};
function switchTab(t){tab=t;for(const x of ['learn','quiz','lab','review'])$('#'+x).hidden=x!==t;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===t);b.setAttribute('aria-current',b.dataset.tab===t?'page':'false');});if(t==='review')renderReview();if(t==='lab')renderLab();}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('#export').onclick=()=>download('sql-learning-progress.json',JSON.stringify(state,null,2),'application/json');$('#import').onclick=()=>$('#importfile').click();
$('#importfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const next=validate(JSON.parse(await f.text()));if(!confirm('以导入记录替换当前学习记录？建议先导出备份。'))return;state=next;save();resetView();if(tab==='lab')renderLab();if(tab==='review')renderReview();status('记录已导入。');}catch(err){status('导入失败：'+err.message+'。现有记录未更改。');}finally{e.target.value='';}};
$('#reset').onclick=()=>{if(!confirm('清空新版所有答案、收藏、实战草稿和复习记录？此操作不可撤销。'))return;state=blank();save();resetView();renderLab();renderReview();status('新版记录已清空；原版题库记录不受影响。');};
const LESSONS=[
['01 / 基础与纠偏','把语法放回正确的概念里','数据库概述','区分数据库、数据库管理系统和 SQL。先建表，再插入三条数据，用 SELECT 验证每次修改。',['INT 占 4 字节；INT(11) 的 11 不是容量。金额考虑 DECIMAL。','主键可以是多列；自增不承诺连续，也不一定必须是主键。','NULL 是未知，不是 0 或空字符串。比较使用 IS NULL。'],'CREATE TABLE notes (\n  id BIGINT PRIMARY KEY AUTO_INCREMENT,\n  title VARCHAR(100) NOT NULL,\n  amount DECIMAL(10,2) DEFAULT 0\n);','验收：能解释类型、约束和默认值分别保护什么。'],
['02 / 查询与聚合','先确定“一行代表什么”','聚合分组','先写出结果粒度：每个订单、每个客户，还是每天？再决定要不要聚合。',['常见逻辑理解顺序：FROM/JOIN → WHERE → GROUP BY → HAVING → 窗口 → SELECT/DISTINCT → ORDER BY → LIMIT；不是物理执行顺序。','COUNT(*) 数行，COUNT(列) 忽略 NULL。空集合的 SUM 返回 NULL。','ONLY_FULL_GROUP_BY 下不要混入不确定的非分组列。'],"SELECT customer_id, SUM(amount) AS revenue\nFROM orders\nWHERE status = 'paid'\nGROUP BY customer_id\nHAVING SUM(amount) >= 300\nORDER BY revenue DESC, customer_id;",'验收：能手算结果，解释 WHERE 与 HAVING 的位置。'],
['03 / 关联与子查询','先理解行数，再写 JOIN','多表与子查询','每次 JOIN 前先想清楚是一对一还是一对多。数据膨胀是报表金额翻倍的常见原因。',['LEFT JOIN 的右表条件放 WHERE 可能丢失无匹配行。','需要不存在关系时优先理解 NOT EXISTS；警惕 NOT IN 中的 NULL。','多个一对多关系先分别聚合，再连接；DISTINCT 不是通用修复。'],"SELECT c.id, c.name, COUNT(o.id) AS paid_count\nFROM customers c\nLEFT JOIN orders o\n  ON o.customer_id = c.id AND o.status = 'paid'\nGROUP BY c.id, c.name;",'验收：能说明为什么这里不能 COUNT(*)。'],
['04 / 窗口与 CTE','保留明细，也能计算排名','窗口函数','窗口函数可以在每行上附加排名、累计值、前后行对比，不压缩原始行。',['Top N 先确认是否包含并列。精确 N 行用 ROW_NUMBER，含并列档位可用 DENSE_RANK。','同时间记录要增加唯一 id 排序，得到稳定结果。','累计值显式写 ROWS 窗口，避免默认 RANGE 的同值行为。'],"WITH ranked AS (\n  SELECT id, customer_id, amount,\n    ROW_NUMBER() OVER (\n      PARTITION BY customer_id\n      ORDER BY created_at DESC, id DESC\n    ) AS rn\n  FROM orders WHERE status = 'paid'\n)\nSELECT * FROM ranked WHERE rn = 1;",'验收：能解释为什么 rn 不能在内层 WHERE 中直接过滤。'],
['05 / 索引与性能','用证据优化，而不是凭感觉','索引与性能','先证明结果正确，再分析扫描了多少行，最后测试索引与改写带来的变化。',['联合索引考虑等值过滤、范围与排序，以及真实选择性。','避免无必要的 SELECT *；普通索引列上的函数可能妨碍直接范围查找。','EXPLAIN 是计划，EXPLAIN ANALYZE 会实际执行；需要合适的环境。'],"EXPLAIN\nSELECT id, amount FROM orders\nWHERE customer_id = 1\n  AND created_at >= '2026-01-01'\n  AND created_at < '2026-02-01'\nORDER BY created_at, id;\n-- 候选索引：(customer_id, created_at, id)",'验收：能比较建索引前后的计划，并说明写入与空间代价。'],
['06 / 事务与工程','让 SQL 在并发中也正确','事务与并发','单次运行正确不代表并发正确。思考两个请求同时执行时，会不会重复扣款或超卖。',['把库存条件放进同一 UPDATE，检查影响行数。','事务涵盖一组必须共同成功的操作；异常时回滚。','参数化绑定值、最小权限、幂等键和有限重试，都属于真实工程能力。'],"START TRANSACTION;\nUPDATE stock SET qty = qty - 1\nWHERE id = 1 AND qty > 0;\n-- 应用检查影响行数：只有 1 才继续创建订单\n-- 任一步失败：ROLLBACK；全部成功：COMMIT",'验收：能说明失败路径、死锁重试和 TRUNCATE 隐式提交。']
];
$('#learn').innerHTML='<div class="notice">建议每天 30–45 分钟：10 分钟理解概念 → 20 分钟做题或实战 → 5 分钟复述错因。复习间隔为 1 / 3 / 7 / 14 天。</div><div class="roadmap">'+LESSONS.map(([step,title,t,desc,bullets,sql,goal])=>`<article class="lesson"><div class="step">${step}</div><h2>${title}</h2><p>${desc}</p><ul>${bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><pre>${esc(sql)}</pre><p class="muted">${goal}</p><button data-practice="${t}">开始这一阶段 →</button></article>`).join('')+'</div>';
document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{topic=b.dataset.practice;filter='all';query='';$('#filter').value='all';$('#search').value='';applyFilter();switchTab('quiz');});
const DATA_SQL=__DATA_SQL__;
const CASES=__CASES__;
function renderLab(){ $('#lab').innerHTML=`<div class="panel" style="margin-bottom:18px"><h2>一套数据，八个业务问题</h2><p>电商订单数据包含 4 位客户、8 笔订单：已支付、退款、待支付、无订单客户与并列金额。先写 SQL 和预期结果，再展开参考解法。</p><p class="muted">本页是离线编辑与自查练习，不连接 MySQL，也不会执行或自动验证 SQL。下载脚本后，在 MySQL 8.0.16+ 的独立练习库中运行；脚本创建 sql_training_lab 数据库，不会自动删表。实战完成状态为你自行确认。</p><button id="dataset" class="primary">下载建表与样例数据 .sql</button> <button id="solutions">下载参考解法 .sql</button><details><summary>查看表结构与全部样例数据</summary><pre>${esc(DATA_SQL)}</pre></details></div>`+CASES.map((c,i)=>`<article class="case"><div class="qmeta"><span class="chip">实战 ${i+1} / 8</span><span>${esc(c.topic)}</span></div><h2>${esc(c.title)}</h2><p>${esc(c.task)}</p><textarea data-draft="${i}" aria-label="实战 ${i+1} SQL 草稿" spellcheck="false" placeholder="先独立写出 SQL，草稿会自动保存…">${esc(state.drafts[i]||'')}</textarea><details><summary>给我一点提示</summary><p>${esc(c.hint)}</p></details><details><summary>参考解法、预期结果与边界检查</summary><pre>${esc(c.sql)}</pre><div class="tablewrap"><table><thead><tr>${c.cols.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>${esc(c.explain)}</p><p class="muted">加练：${esc(c.extra)}</p></details><label><input type="checkbox" data-case="${i}" ${state.cases[i]?'checked':''}> 我已在 MySQL 运行核对，并能解释边界情况（自评）</label></article>`).join('');$('#dataset').onclick=()=>download('sql-training-data.sql',DATA_SQL,'text/plain');$('#solutions').onclick=()=>download('sql-training-solutions.sql','USE sql_training_lab;\n\n'+CASES.map((c,i)=>'-- '+(i+1)+'. '+c.title+'\n'+c.sql).join('\n\n'),'text/plain');$('#lab').querySelectorAll('[data-draft]').forEach(el=>el.oninput=()=>{state.drafts[el.dataset.draft]=el.value;save();});$('#lab').querySelectorAll('[data-case]').forEach(el=>el.onchange=()=>{state.cases[el.dataset.case]=el.checked;save();});}
function renderReview(){const hist=Object.values(state.history),errors=hist.reduce((n,h)=>n+h.errors,0),due=BANK.filter(q=>state.history[q.id]?.due<=Date.now()).length;$('#review').innerHTML=`<div class="panel"><h2>把错题变成下一次的优势</h2><p>累计提交 ${hist.reduce((n,h)=>n+h.attempts,0)} 次 · 未匹配/答错 ${errors} 次 · 到期复习 ${due} 题 · 实战自评完成 ${Object.values(state.cases).filter(Boolean).length} / 8</p><p class="muted">答对后按连续正确次数安排 1 / 3 / 7 / 14 天复习；答错后 1 天。修改答案不删除历史。正确率衡量当前参考匹配，不等于真实 SQL 熟练度。</p><button id="duego" class="primary">练习到期题目</button> <button id="wronggo">练习当前错题</button></div><h2>知识点覆盖</h2><div class="reviewgrid">${[...new Set(BANK.map(q=>q.topic))].map(t=>{const qs=BANK.filter(q=>q.topic===t),n=qs.filter(q=>state.graded[q.id]).length,r=qs.filter(q=>state.graded[q.id]&&right(q)).length;return `<div class="panel"><div class="reviewrow"><strong>${esc(t)}</strong><span class="muted">答对 ${r} / ${qs.length}</span></div><div class="progress"><i style="width:${r/qs.length*100}%"></i></div><span class="muted">已提交 ${n} 题${n?' · 正确率 '+Math.round(r/n*100)+'%':' · 尚未开始'}</span></div>`;}).join('')}</div><div class="notice" style="margin-top:18px">毕业检查：不看答案写完 8 个实战；解释 NULL、并列、无匹配、数据重复；用自己的 MySQL 查看执行计划；能设计失败回滚与重试。然后再挑战更大的真实数据集。</div>`;for(const [id,f] of [['duego','due'],['wronggo','wrong']])$('#'+id).onclick=()=>{topic='all';filter=f;query='';$('#filter').value=f;$('#search').value='';applyFilter();switchTab('quiz');};}
setInterval(()=>{if(!document.hidden){state.seconds++;updateStats();if(state.seconds%15===0)save();}},1000);window.addEventListener('pagehide',save);
render();renderLab();status(storageOK?'已保留原版文件为 1.original.html。新版独立记录进度，避免旧版误判结果影响学习。':'无法读取本地记录，当前使用临时进度。请定期导出备份。');
