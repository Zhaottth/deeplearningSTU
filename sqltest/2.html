:root{--bg:#f4f5f0;--card:#fff;--ink:#172b35;--muted:#60727b;--line:#dce4e2;--green:#315b98;--mint:#edf3ff;--red:#a72d36;--nav:#172b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:7px 13px}button:hover{border-color:var(--green);background:var(--mint)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e4af44;outline-offset:3px}header{background:var(--nav);color:#fff;padding:25px max(20px,calc((100vw - 1180px)/2)) 0}.brand{font-size:12px;letter-spacing:3px;color:#a8d4c4}.hero{display:flex;justify-content:space-between;align-items:center;gap:30px;padding:14px 0 24px}h1{font-size:clamp(25px,4vw,37px);line-height:1.35;margin:5px 0 12px}header p{color:#c1d4d6;margin:0;max-width:690px}.badge{border:1px solid #507077;border-radius:30px;padding:5px 12px;font-size:12px;white-space:nowrap}.tabs{display:flex;gap:6px}.tabs button{white-space:nowrap;border:0;border-radius:10px 10px 0 0;padding:12px 20px;background:transparent;color:#bed1d2}.tabs button.active{background:var(--bg);color:var(--green);font-weight:700}main{max-width:1180px;margin:0 auto;padding:26px 20px 50px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.metric,.panel,.question,.lesson,.case{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.metric b{font-size:27px;display:block;line-height:1.4}.muted,.metric span{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}.sidebar{align-self:start;position:sticky;top:16px}.sidebar h2{font-size:16px;margin:0 0 12px}.topic{display:block;width:100%;text-align:left;border:0;border-radius:8px;margin:3px 0;font-size:13px;padding:6px 9px}.topic.active{background:var(--mint);color:var(--green);font-weight:bold}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}input[type=search]{min-width:150px;flex:1;width:100%}textarea{display:block;width:100%;min-height:100px;font:14px/1.65 Consolas,monospace;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #65a99a;outline-offset:1px}.question{margin:12px 0;scroll-margin-top:16px}.qmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px}.chip{border-radius:20px;padding:2px 10px;background:#edf3f3;color:#31585d}.qmeta button{margin-left:auto;padding:2px 9px;font-size:12px}.question h3{font-size:16px;font-weight:600;margin:14px 0}.opt{display:flex;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer}.opt:has(input:checked){background:#eff7f4;border-color:#529a87}.opt.correct{border-color:#57a57c;background:#edf8f0}.opt.incorrect{border-color:#d89898;background:#fff1f1}.opt input{accent-color:var(--green);flex-shrink:0}.feedback{padding:12px 15px;border-left:3px solid var(--green);background:#eef8f2;margin-top:12px;border-radius:0 8px 8px 0}.feedback.bad{border-color:var(--red);background:#fff3f2}.feedback p{margin:4px 0}.question .actions{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}code,pre{font-family:Consolas,monospace}code{background:#edf1ee;padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#132f37;color:#d7efe7;padding:16px;border-radius:10px;font-size:13px;line-height:1.7}.sheet{display:flex;gap:5px;flex-wrap:wrap;max-height:200px;overflow:auto;margin-top:12px}.sheet button{font-size:11px;padding:3px 6px;min-width:31px}.sheet .done{background:#e7eef8}.sheet .right{background:#dff2e5;color:#16633b}.sheet .wrong{background:#fae2df;color:#922a34}.sheet .current{outline:2px solid #87a5a5}.paging{display:flex;align-items:center;justify-content:space-between;margin:20px 0;gap:8px}.empty{text-align:center;padding:40px;background:white;border-radius:12px}.result{background:#e7f3ed;border:1px solid #a4ccbb;padding:20px;border-radius:12px;margin:12px 0}.result h2{margin:0}.progress{height:7px;border-radius:9px;background:#e2e9e5;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--green)}.roadmap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lesson h2,.case h2{font-size:20px;margin:8px 0}.lesson p{margin:10px 0}.lesson ul{padding-left:20px}.lesson .step{color:var(--green);font-size:12px;letter-spacing:1px}.case{margin-bottom:18px}.case details{border-top:1px solid var(--line);padding:12px 0;margin-top:12px}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}.tablewrap{overflow-x:auto}.notice{padding:12px 16px;background:#fff5db;border:1px solid #ead7a4;border-radius:10px;margin-bottom:16px;font-size:13px}#status{font-size:13px;color:var(--muted);min-height:24px;margin-bottom:8px}footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}.reviewgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.reviewrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.tools{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:780px){.layout{grid-template-columns:1fr}.sidebar{position:static}.sidebar #topics{display:flex;flex-wrap:wrap}.topic{width:auto}.hero{display:block}.badge{display:inline-block;margin-top:15px}.stats{grid-template-columns:repeat(2,1fr)}.roadmap,.reviewgrid{grid-template-columns:1fr}.tabs button{padding:11px 8px;flex:1;font-size:13px}.sheet{max-height:105px}mai <script>
const BANK=[{"topic": "单表查询与聚合", "type": "s", "q": "价格为 10、20、NULL 的三行，COUNT(*)、COUNT(price)、AVG(price) 分别是？", "o": ["3、3、10", "3、2、15", "2、2、15", "3、2、10"], "a": [1], "e": "COUNT(*) 数行，COUNT(price) 与 AVG(price) 忽略 NULL；平均值为 30/2。\u003cbr>\u003cspan class=\"muted\">依据：单表查询.md\u003c/span>"}, {"topic": "单表查询与聚合", "type": "s", "q": "查询各类别均价，只保留均价大于 100 的类别。应在哪一步过滤均价？", "o": ["WHERE AVG(price)>100", "HAVING AVG(price)>100", "LIMIT 100", "ON AVG(price)>100"], "a": [1], "e": "先 GROUP BY category_id 聚合，再 HAVING 过滤分组。\u003cbr>\u003cspan class=\"muted\">依据：单表查询.md\u003c/span>"}, {"topic": "单表查询与聚合", "type": "s", "q": "筛选“自营且价格在 100~200，或评分为空”的商品，哪个条件符合口径？", "o": ["is_self='自营' AND (price BETWEEN 100 AND 200 OR score IS NULL)", "(is_self='自营' AND price BETWEEN 100 AND 200) OR score IS NULL", "price>100 AND price\u003c200", "score=NULL"], "a": [1], "e": "评分为空的商品不要求自营；BETWEEN 包含两端。\u003cbr>\u003cspan class=\"muted\">依据：单表查询.md\u003c/span>"}, {"topic": "单表查询与聚合", "type": "s", "q": "每页 10 条，按 price DESC,id ASC 排序后取第 3 页，使用？", "o": ["LIMIT 3,10", "LIMIT 30,10", "LIMIT 20,10", "LIMIT 10,20"], "a": [2], "e": "偏移量=(页码-1)×每页数量。唯一 id 作为第二排序键能稳定处理同价商品。\u003cbr>\u003cspan class=\"muted\">依据：单表查询.md\u003c/span>"}, {"topic": "单表查询与聚合", "type": "m", "q": "关于 DISTINCT，哪些正确？", "o": ["SELECT DISTINCT name,price 对字段组合去重", "DISTINCT 会修改原表", "同名不同价的行可能同时保留", "DISTINCT 自动保证结果排序"], "a": [0, 2], "e": "DISTINCT 作用于选出的一整组列，不修改原表，也不保证顺序。\u003cbr>\u003cspan class=\"muted\">依据：单表查询.md\u003c/span>"}, {"topic": "单表查询与聚合", "type": "m", "q": "LIKE &#x27;_茶%&#x27; 可以匹配以下哪些值？", "o": ["红茶", "茶", "冰茶拿铁", "奶香茶"], "a": [0, 2], "e": "下划线匹配一个字符，百分号匹配零个或多个字符；第二个字符必须是茶。\u003cbr>\u003cspan class=\"muted\">依据：单表查询.md\u003c/span>"}, {"topic": "单表查询与聚合", "type": "s", "q": "一张空表执行 SELECT COUNT(*), SUM(amount) FROM sales，结果是？", "o": ["没有结果行", "0、0", "0、NULL", "NULL、NULL"], "a": [2], "e": "没有 GROUP BY 的整体聚合仍返回一行；SUM 可用 COALESCE 补零。\u003cbr>\u003cspan class=\"muted\">依据：单表查询.md\u003c/span>"}, {"topic": "单表查询与聚合", "type": "s", function sheet(){const panel=$('#sheet');panel.innerHTML=activeIds.map((id,n)=>`<button data-id="${id}" title="第 ${id+1} 题" class="${visibleGrade(BANK[id])?(right(BANK[id])?'right':'wrong'):answered(BANK[id])?'done':''} ${Math.floor(n/size)===page?'current':''}">${id+1}</button>`).join('');panel.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.id);page=Math.floor(activeIds.indexOf(i)/size);render();document.getElementById('q'+i)?.scrollIntoView({block:'start'});});}
function feedback(q){if(!visibleGrade(q))return '';const ok=right(q);const a=q.type==='f'?`<code>${esc(q.a[0])}</code>`:q.a.map(i=>`${String.fromCharCode(65+i)}. ${esc(q.o[i])}`).join('；');return `<div class="feedback ${ok?'':'bad'}"><strong>${ok?'✓ '+(q.type==='f'?'匹配参考答案':'回答正确'):q.type==='f'?'待核对：未匹配参考写法':'需要再练习'}</strong><p>参考答案：${a}</p><p>${q.e}</p>${q.type==='f'?'<p class="muted">这不是 SQL 引擎判定。等价写法请自行运行核验；统计中仅将匹配参考答案记为答对。</p>':''}</div>`;}
function card(q){const graded=visibleGrade(q),a=state.answers[q.id],locked=mode==='exam'&&examDone;return `<article class="question" id="q${q.id}"><div class="qmeta"><span class="chip">#${q.id+1}</span>${q.id>=60?'<span class="chip">新增</span>':''}<span>${esc(q.topic)}</span><span class="muted">${({s:'单选',m:'多选',j:'判断',f:'命令默写'})[q.type]}</span><button data-star="${q.id}" aria-pressed="${!!state.stars[q.id]}">${state.stars[q.id]?'★ 已收藏':'☆ 收藏'}</button></div><h3>${q.q}</h3>${q.type==='f'?`<textarea data-answer="${q.id}" aria-label="第 ${q.id+1} 题 SQL 答案" spellcheck="false" placeholder="输入完整 SQL；保留字符串引号" ${locked?'disabled':''}>${esc(a||'')}</textarea>`:q.o.map((o,i)=>`<label class="opt ${graded&&q.a.includes(i)?'correct':graded&&(Array.isArray(a)?a.includes(i):a===i)?'incorrect':''}"><input data-answer="${q.id}" type="${q.type==='m'?'checkbox':'radio'}" name="q${q.id}" value="${i}" ${(Array.isArray(a)?a.includes(i):a===i)?'checked':''} ${locked?'disabled':''}><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')}<div class="actions">${mode==='practice'?`<button data-check="${q.id}">${state.graded[q.id]?'已提交 · 修改后可重判':'提交本题'}</button>`:'<span class="muted">考试模式：统一交卷后显示解析。</span>'}</div>${feedback(q)}</article>`;}
function render(){topics();const max=Math.max(1,Math.ceil(activeIds.length/size));page=Math.min(page,max-1);$('#list').innerHTML=activeIds.slice(page*size,(page+1)*size).map(i=>card(BANK[i])).join('')||'<div class="empty">当前没有符合条件的题目。试试其他知识点或筛选。</div>';$('#range').textContent=`本题单 ${activeIds.length} 题`;$('#pageinfo').textContent=`${page+1} / ${max} 页`;$('#prev').disabled=page===0;$('#next').disabled=page===max-1;$('#submit').disabled=!activeIds.length||mode==='exam'&&examDone;
 $('#list').querySelectorAll('[data-answer]').forEach(el=>{el.addEventListener(el.tagName==='TEXTAREA'?'input':'change',()=>{const id=+el.dataset.answer,q=BANK[id];state.answers[id]=q.type==='f'?el.value:q.type==='m'?[...document.getElementsByName('q'+id)].filter(x=>x.checked).map(x=>+x.value):+el.value;delete state.graded[id];$('#result').hidden=true;const c=$('#q'+id);c.querySelector('.feedback')?.remove();c.querySelectorAll('.correct,.incorrect').forEach(x=>x.classList.remove('correct','incorrect'));const btn=c.querySelector('[data-check]');if(btn)btn.textContent='提交本题';save();updateStats();sheet();});});
 $('#list').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const q=BANK[+b.dataset.check];if(!answered(q)){status('请先作答，再提交本题。');return;}grade(q);save();render();status('已保存本题结果。修改答案后可重新提交。');});
 $('#list').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const id=+b.dataset.star;state.stars[id]=!state.stars[id];save();b.textContent=state.stars[id]?'★ 已收藏':'☆ 收藏';b.setAttribute('aria-pressed',String(state.stars[id]));});sheet();updateStats();}
function grade(q){if(state.graded[q.id]||!answered(q))return;state.graded[q.id]=true;const old=state.history[q.id]||{attempts:0,errors:0,streak:0};const ok=right(q),streak=ok?old.streak+1:0;state.history[q.id]={attempts:old.attempts+1,errors:old.errors+(ok?0:1),streak,due:Date.now()+(ok?[1,3,7,14][Math.min(streak-1,3)]:1)*86400000};}
function submit(){if(!activeIds.length)return;activeIds.forEach(i=>grade(BANK[i]));examDone=mode==='exam';save();render();const done=activeIds.filter(i=>answered(BANK[i])).length,correct=activeIds.filter(i=>right(BANK[i])).length;const r=$('#result');r.hidden=false;r.className='result';r.innerHTML=`<h2>${correct} / ${activeIds.length} 题符合参考答案</h2><p>已作答 ${done} 题，未答 ${activeIds.length-done} 题。题单得分 ${Math.round(correct/activeIds.length*100)}%。</p><p>建议：先解释错因，再到“业务实战”写完整查询。未作答题不计入错题记录。</p>`;r.scrollIntoView({block:'start'});}
function resetView(){topic='all';filter='all';query='';$('#filter').value='all';$('#search').value='';order=BANK.map(q=>q.id);examDone=false;applyFilter();}
$('#submit').onclick=submit;$('#prev').onclick=()=>{page--;render();$('#quiz').scrollIntoView();};$('#next').onclick=()=>{page++;render();$('#quiz').scrollIntoView();};$('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();applyFilter();};$('#filter').onchange=e=>{filter=e.target.value;applyFilter();};
$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}applyFilter();};
$('#retry').onclick=()=>{if(!activeIds.length||!confirm('清除当前题单的答案，开始重练？收藏与历史错题次数会保留。'))return;activeIds.forEach(i=>{delete state.answers[i];delete state.graded[i];});examDone=false;save();$('#result').hidden=true;render();status('已开始重练当前题单，历史复习记录已保留。');};
$('#mode').onchange=e=>{mode=e.target.value;examDone=false;$('#result').hidden=true;render();status(mode==='exam'?'考试模式已隐藏解析。如需全新考试，请点击“重练当前题单”。':'已切回练习模式。');};
function switchTab(t){tab=t;for(const x of ['learn','quiz','lab','review'])$('#'+x).hidden=x!==t;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===t);b.setAttribute('aria-current',b.dataset.tab===t?'page':'false');});if(t==='review')renderReview();if(t==='lab')renderLab();}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('#export').onclick=()=>download('sql-learning-2-progress.json',JSON.stringify(state,null,2),'application/json');$('#import').onclick=()=>$('#importfile').click();
$('#importfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const next=validate(JSON.parse(await f.text()));if(!confirm('以导入记录替换当前学习记录？建议先导出备份。'))return;state=next;save();resetView();if(tab==='lab')renderLab();if(tab==='review')renderReview();status('记录已导入。');}catch(err){status('导入失败：'+err.message+'。现有记录未更改。');}finally{e.target.value='';}};
$('#reset').onclick=()=>{if(!confirm('清空第二册所有答案、收藏、实战草稿和复习记录？此操作不可撤销。'))return;state=blank();save();resetView();renderLab();renderReview();status('第二册记录已清空；第一册记录不受影响。');};
const LESSONS=[["01 / 单表查询.md", "把筛选与统计分开", "单表查询与聚合", "先写清结果是一行一商品，还是一行一类别。", ["WHERE 管明细，HAVING 管分组。", "COUNT(*)、COUNT(列)、COUNT(DISTINCT 列) 的分母不同。", "分页必须明确排序，日期筛选优先半开区间。"], "SELECT category_id,AVG(price) AS avg_price\nFROM products WHERE price>0\nGROUP BY category_id HAVING AVG(price)>100;", "验收：先独立完成本章 20 题，再解释每个错误选项为什么错。"], ["02 / 多表查询.md", "联表前先算行数", "多表与子查询", "根据单表、多表笔记，把内连接、外连接、自连接和子查询放到业务中理解。", ["外连接右表条件放 WHERE 可能丢掉无匹配行。", "多个一对多表先聚合，不能盲目用 DISTINCT 修补。", "NOT IN 的 NULL 陷阱与 NOT EXISTS 的语义要区分。"], "SELECT s.store_id,COUNT(e.employee_id) AS n\nFROM stores s LEFT JOIN employees e\nON e.store_id=s.store_id\nGROUP BY s.store_id;", "验收：先独立完成本章 20 题，再解释每个错误选项为什么错。"], ["03 / MySQL函数.md", "函数服务于指标", "内置函数与条件", "覆盖数值、字符串、时间日期和 CASE 条件判断。", ["LENGTH 算字节，CHAR_LENGTH 算字符。", "DATEDIFF 与 TIMESTAMPDIFF 参数方向不同。", "FORMAT 用于展示；平均、排序仍应保留数值。"], "SELECT ROUND(SUM(amount)/NULLIF(SUM(quantity),0),2)\nAS unit_revenue FROM sales;", "验收：先独立完成本章 20 题，再解释每个错误选项为什么错。"], ["04 / MySQL函数.md · 开窗函数", "先确定粒度，再开窗口", "窗口函数与分析", "训练排名、前后行、分桶、累计和窗口范围。", ["ROW_NUMBER 取行，DENSE_RANK 取并列档位。", "LAG 是上一行，日历环比要先补齐月份。", "逐行累计明确 ROWS 和稳定排序键。"], "SELECT sale_id,amount,\nSUM(amount) OVER(ORDER BY sale_date,sale_id\nROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)\nAS running_amount FROM sales;", "验收：先独立完成本章 20 题，再解释每个错误选项为什么错。"], ["05 / MySQL索引和函数.md", "用执行计划检验索引", "索引与备份", "索引笔记中的规则是起点，是否有效要结合实际执行计划。", ["IS NULL、\u003c> 不意味着索引必然失效。", "普通索引列上的函数可能阻碍直接范围查找。", "索引有空间与写入成本；备份要练习恢复。"], "EXPLAIN SELECT sale_id,amount FROM sales\nWHERE store_id=1 AND sale_date>='2024-01-01'\nAND sale_date\u003c'2025-01-01';\n-- 候选联合索引：(store_id,sale_date)", "验收：先独立完成本章 20 题，再解释每个错误选项为什么错。"], ["06 / day08_数据分析综合实战1.md / 实战2.md", "用两个项目练口径", "业务指标与口径", "咖啡店练销售、数量和贡献；新能源汽车练客户、售后和时间间隔。", ["明确记录数、去重客户数与商品数量。", "车辆售价为万元，售后成本为元。", "先写时间边界、并列规则与无匹配处理，再写 SQL。"], "-- 两组精简数据包含：\n-- 无销售门店、零业绩员工、缺失月份\n-- 未售车辆、无售后车辆、同日服务、边界保养\n-- 到业务实战下载数据，逐项核对预期结果。", "验收：先独立完成本章 20 题，再解释每个错误选项为什么错。"]];

const DATA_SQL="-- MySQL 8.0.16+；六份笔记场景的精简改编数据，不是原始全量数据。\n-- 首次导入使用；表已存在会报错，请勿重复插入。两个练习库互相独立。\nCREATE DATABASE IF NOT EXISTS coffee_training_2 CHARACTER SET utf8mb4;\nUSE coffee_training_2;\nCREATE TABLE stores (store_id INT PRIMARY KEY,store_name VARCHAR(50) NOT NULL UNIQUE,city VARCHAR(30) NOT NULL,open_date DATE NOT NULL);\nCREATE TABLE employees (employee_id INT PRIMARY KEY,employee_name VARCHAR(50) NOT NULL,hire_date DATE NOT NULL,position VARCHAR(30) NOT NULL,store_id INT NOT NULL,FOREIGN KEY(store_id) REFERENCES stores(store_id));\nCREATE TABLE products (product_id INT PRIMARY KEY,product_name VARCHAR(50) NOT NULL UNIQUE,category VARCHAR(30) NOT NULL,price DECIMAL(10,2) NOT NULL DEFAULT 0);\nCREATE TABLE sales (sale_id INT PRIMARY KEY,sale_date DATE NOT NULL,quantity INT NOT NULL DEFAULT 1,amount DECIMAL(10,2) NOT NULL,employee_id INT NOT NULL,store_id INT NOT NULL,product_id INT NOT NULL,FOREIGN KEY(employee_id) REFERENCES employees(employee_id),FOREIGN KEY(store_id) REFERENCES stores(store_id),FOREIGN KEY(product_id) REFERENCES products(product_id));\nINSERT INTO stores VALUES (1,'北京店','北京','2020-01-01'),(2,'上海店','上海','2020-02-01'),(3,'杭州店','杭州','2021-01-01');\nINSERT INTO employees VALUES (1,'小林','2023-01-01','店长',1),(2,'小陈','2023-02-01','店员',1),(3,'小周','2023-01-01','店长',2),(4,'小吴','2024-01-01','店员',2);\nINSERT INTO products VALUES (1,'美式','咖啡',20),(2,'拿铁','咖啡',30),(3,'蛋糕','糕点',25),(4,'可颂','糕点',15);\nINSERT INTO sales VALUES\n(1,'2024-01-01',2,40,1,1,1),(2,'2024-01-01',2,60,2,1,2),\n(3,'2024-01-02',2,60,1,1,2),(4,'2024-02-01',1,20,2,1,1),\n(5,'2024-01-01',3,60,3,2,1),(6,'2024-03-01',2,50,3,2,3);\n\nCREATE DATABASE IF NOT EXISTS ev_training_2 CHARACTER SET utf8mb4;\nUSE ev_training_2;\nCREATE TABLE customers (customer_id INT PRIMARY KEY,name VARCHAR(50) NOT NULL,gender CHAR(1) NOT NULL,phone VARCHAR(20) NOT NULL UNIQUE,city VARCHAR(30) NOT NULL,registration_date DATE NOT NULL);\nCREATE TABLE vehicles (vin VARCHAR(18) PRIMARY KEY,model VARCHAR(30) NOT NULL,brand VARCHAR(20) NOT NULL,production_date DATE NOT NULL,battery_capacity DECIMAL(5,1) NOT NULL,sale_price DECIMAL(10,2) NOT NULL);\nCREATE TABLE sales (sale_id INT PRIMARY KEY,vin VARCHAR(18) NOT NULL,customer_id INT NOT NULL,sale_date DATE NOT NULL,sales_rep VARCHAR(30) NOT NULL,store_city VARCHAR(30) NOT NULL,FOREIGN KEY(vin) REFERENCES vehicles(vin),FOREIGN KEY(customer_id) REFERENCES customers(customer_id));\nCREATE TABLE service_records (service_id INT PRIMARY KEY,vin VARCHAR(18) NOT NULL,service_date DATE NOT NULL,service_type VARCHAR(20) NOT NULL,cost DECIMAL(8,2) NOT NULL DEFAULT 0,description VARCHAR(200),FOREIGN KEY(vin) REFERENCES vehicles(vin));\nINSERT INTO customers VALUES (1,'张伟','M','13800000001','北京','2023-01-01'),(2,'李娜','F','13800000002','上海','2023-02-01'),(3,'王强','M','13800000003','北京','2023-03-01');\nINSERT INTO vehicles VALUES ('V1','Model S','GreenDrive','2023-01-01',100,30),('V2','iX3','GreenDrive','2023-01-01',80,20),('V3','Model S','GreenDrive','2023-01-01',100,30),('V4','NIO ET7','GreenDrive','2023-01-01',150,40);\nINSERT INTO sales VALUES (1,'V1',1,'2024-01-01','顾问甲','北京'),(2,'V2',2,'2024-01-02','顾问乙','上海'),(3,'V3',1,'2024-02-01','顾问甲','北京');\nINSERT INTO service_records VALUES (1,'V1','2024-01-11','保养',300,'首次'),(2,'V1','2024-02-10','维修',1000,'维修'),(3,'V2','2024-04-02','保养',200,'满三个月'),(4,'V2','2024-04-12','软件升级',0,NULL),(5,'V1','2024-02-10','软件升级',0,NULL);\n";
const CASES=[{"db": "coffee_training_2", "title": "01 · 所有门店的员工数", "topic": "左连接 / COUNT", "task": "返回所有门店的 store_id、store_name、employee_count，包含没有员工的门店；按 store_id 排序。", "hint": "用员工主键计数，别用 COUNT(*)。", "sql": "SELECT s.store_id, s.store_name, COUNT(e.employee_id) AS employee_count\nFROM stores s LEFT JOIN employees e ON e.store_id=s.store_id\nGROUP BY s.store_id,s.store_name ORDER BY s.store_id;", "cols": ["store_id", "store_name", "employee_count"], "rows": [[1, "北京店", 2], [2, "上海店", 2], [3, "杭州店", 0]], "explain": "杭州店没有员工，仍需保留。", "extra": "再统计各店有销售记录的员工数，避免一位员工多笔销售造成重复。"}, {"db": "coffee_training_2", "title": "02 · 每件商品的实际收入", "topic": "聚合 / 加权平均", "task": "按产品统计售出数量 qty、收入 revenue、每件平均收入 unit_revenue，包含未售产品；未售产品平均收入显示 NULL。按 product_id 排序。", "hint": "总金额除以总数量，零分母用 NULLIF。", "sql": "SELECT p.product_id, COALESCE(SUM(s.quantity),0) AS qty,\n COALESCE(SUM(s.amount),0) AS revenue,\n ROUND(SUM(s.amount)/NULLIF(SUM(s.quantity),0),2) AS unit_revenue\nFROM products p LEFT JOIN sales s ON s.product_id=p.product_id\nGROUP BY p.product_id ORDER BY p.product_id;", "cols": ["product_id", "qty", "revenue", "unit_revenue"], "rows": [[1, 6, 120, 20], [2, 4, 120, 30], [3, 2, 50, 25], [4, 0, 0, "NULL"]], "explain": "未售不意味着商品单价为 0，平均成交收入此时没有定义。", "extra": "只保留收入至少 100 的商品，使用 HAVING。"}, {"db": "coffee_training_2", "title": "03 · 每店最畅销的产品", "topic": "先聚合 / 并列排名", "task": "按销售门店统计总销售数量，取每店销量第一的全部并列产品。返回 store_id、product_id、qty，按门店和产品编号排序；无销售门店不返回。", "hint": "先按门店和产品汇总，再按门店做 DENSE_RANK。", "sql": "WITH totals AS (\n SELECT store_id,product_id,SUM(quantity) AS qty FROM sales\n GROUP BY store_id,product_id\n), ranked AS (\n SELECT *,DENSE_RANK() OVER(PARTITION BY store_id ORDER BY qty DESC) AS rk FROM totals\n)\nSELECT store_id,product_id,qty FROM ranked WHERE rk=1\nORDER BY store_id,product_id;", "cols": ["store_id", "product_id", "qty"], "rows": [[1, 2, 4], [2, 1, 3]], "explain": "先聚合到产品粒度，不能直接对单条销售数量排名。", "extra": "把北京店美式增加 1 件，验证并列冠军会同时返回。"}, {"db": "coffee_training_2", "title": "04 · 门店员工贡献榜", "topic": "多表 / 窗口", "task": "返回全部员工 employee_id、store_id、revenue、rk；没有销售算 0。在所属门店按收入做 DENSE_RANK，最终按门店、排名、员工编号排序。假设员工没有调店，销售 store_id 与员工归属一致。", "hint": "员工 LEFT JOIN 销售，先按员工汇总再排名。", "sql": "WITH totals AS (\n SELECT e.employee_id,e.store_id,COALESCE(SUM(s.amount),0) AS revenue\n FROM employees e LEFT JOIN sales s ON s.employee_id=e.employee_id\n GROUP BY e.employee_id,e.store_id\n)\nSELECT *,DENSE_RANK() OVER(PARTITION BY store_id ORDER BY revenue DESC) AS rk\nFROM totals ORDER BY store_id,rk,employee_id;", "cols": ["employee_id", "store_id", "revenue", "rk"], "rows": [[1, 1, 100, 1], [2, 1, 80, 2], [3, 2, 110, 1], [4, 2, 0, 2]], "explain": "不能把 employee_id 放入排名窗口的 ORDER BY，否则收入相同也不会并列。", "extra": "若员工调店，区分销售发生门店与当前归属门店。"}, {"db": "coffee_training_2", "title": "05 · 每日收入与累计", "topic": "日期粒度 / 窗口边界", "task": "统计有销售日期的 day、revenue、running_revenue。按日期排序，累计包含当日全部收入。", "hint": "先每天一行，再显式 ROWS 累计。", "sql": "WITH daily AS (\n SELECT sale_date AS day,SUM(amount) AS revenue FROM sales GROUP BY sale_date\n)\nSELECT day,revenue,SUM(revenue) OVER(\n ORDER BY day ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n) AS running_revenue FROM daily ORDER BY day;", "cols": ["day", "revenue", "running_revenue"], "rows": [["2024-01-01", 160, 160], ["2024-01-02", 60, 220], ["2024-02-01", 20, 240], ["2024-03-01", 50, 290]], "explain": "累计先统一成日粒度；没有销售的日期不会自动生成。", "extra": "改成每店独立累计，并解释分区键。"}, {"db": "coffee_training_2", "title": "06 · 自然月环比，缺月补零", "topic": "月份序列 / LAG", "task": "上海店 2024 年 1~3 月，每月输出 month、revenue、prev、growth_pct；无销售补 0，首月及上月收入为 0 时增长率为 NULL。", "hint": "用三个目标月份构成日期表；左连接、汇总后再 LAG。", "sql": "WITH months AS (\n SELECT CAST('2024-01-01' AS DATE) AS month\n UNION ALL SELECT CAST('2024-02-01' AS DATE)\n UNION ALL SELECT CAST('2024-03-01' AS DATE)\n), monthly AS (\n SELECT m.month,COALESCE(SUM(s.amount),0) AS revenue\n FROM months m LEFT JOIN sales s ON s.store_id=2\n AND s.sale_date>=m.month AND s.sale_date\u003cDATE_ADD(m.month,INTERVAL 1 MONTH)\n GROUP BY m.month\n), compared AS (\n SELECT *,LAG(revenue) OVER(ORDER BY month) AS prev FROM monthly\n)\nSELECT month,revenue,prev,ROUND((revenue-prev)/NULLIF(prev,0)*100,2) AS growth_pct\nFROM compared ORDER BY month;", "cols": ["month", "revenue", "prev", "growth_pct"], "rows": [["2024-01-01", 60, "NULL", "NULL"], ["2024-02-01", 0, 60, -100], ["2024-03-01", 50, 0, "NULL"]], "explain": "如果不补 2 月，3 月会错误地拿 1 月做环比。这里采用有界月份集合，不需要额外日历表。", "extra": "扩展到所有门店：月份与门店 CROSS JOIN 后再连接销售。"}, {"db": "ev_training_2", "title": "07 · 已售车辆的售后覆盖", "topic": "去重 / 左连接", "task": "返回所有已售 VIN 的 service_count（含 0）；按 VIN 排序，未售车辆 V4 不进入结果。", "hint": "先取得已售 VIN 集合，再左连接服务。", "sql": "WITH sold AS (SELECT DISTINCT vin FROM sales)\nSELECT s.vin,COUNT(r.service_id) AS service_count\nFROM sold s LEFT JOIN service_records r ON r.vin=s.vin\nGROUP BY s.vin ORDER BY s.vin;", "cols": ["vin", "service_count"], "rows": [["V1", 3], ["V2", 2], ["V3", 0]], "explain": "去重已售集合，防止同 VIN 多条销售记录放大服务次数。", "extra": "改成所有车辆，V4 应以 0 次出现在结果中。"}, {"db": "ev_training_2", "title": "08 · 顾问客户数与销售额", "topic": "去重客户 / 金额单位", "task": "每位顾问输出 sales_rep、customer_count、revenue_wan，按顾问名排序。销售额单位为万元，按销售记录计算；不要连接售后明细。", "hint": "客户数 COUNT DISTINCT，金额关联车辆表后汇总。", "sql": "SELECT s.sales_rep,COUNT(DISTINCT s.customer_id) AS customer_count,\n SUM(v.sale_price) AS revenue_wan\nFROM sales s JOIN vehicles v ON v.vin=s.vin\nGROUP BY s.sales_rep ORDER BY s.sales_rep COLLATE utf8mb4_bin;", "cols": ["sales_rep", "customer_count", "revenue_wan"], "rows": [["顾问乙", 1, 20], ["顾问甲", 1, 60]], "explain": "按 utf8mb4_bin 排序固定展示顺序；顾问甲卖了两辆车但只有一位客户。售价字段为万元，服务费用为元。", "extra": "若要统计服务金额，先按合适粒度聚合，再连接；不要 SUM(DISTINCT 售价) 去重。"}, {"db": "ev_training_2", "title": "09 · 购车后三个月内保养", "topic": "EXISTS / 日历边界", "task": "查询 2024 年购车，且购车当日及之后、不满三个日历月发生过保养的客户，姓名去重到客户 ID 粒度；按 customer_id 排序。", "hint": "EXISTS 避免多个保养记录重复客户；日期使用半开区间。", "sql": "SELECT c.customer_id,c.name FROM customers c\nWHERE EXISTS (\n SELECT 1 FROM sales s WHERE s.customer_id=c.customer_id\n AND s.sale_date>='2024-01-01' AND s.sale_date\u003c'2025-01-01'\n AND EXISTS (\n  SELECT 1 FROM service_records r WHERE r.vin=s.vin AND r.service_type='保养'\n  AND r.service_date>=s.sale_date\n  AND r.service_date\u003cDATE_ADD(s.sale_date,INTERVAL 3 MONTH)\n )\n) ORDER BY c.customer_id;", "cols": ["customer_id", "name"], "rows": [[1, "张伟"]], "explain": "V2 的保养恰好在满三个月当天，因此不纳入；这项业务边界已明确采用不含上界。", "extra": "如果改成包含满三个月当天，DATE 字段使用 \u003c=，李娜也会出现。"}, {"db": "ev_training_2", "title": "10 · 每车相邻服务间隔", "topic": "LAG / 同日排序", "task": "输出 vin、service_id、previous_date、gap_days。按 VIN、服务日期、服务 ID 排序，同日两条服务间隔为 0，首条为 NULL。", "hint": "先取 LAG(service_date)，外层 DATEDIFF 当前减上次。", "sql": "WITH compared AS (\n SELECT *,LAG(service_date) OVER(PARTITION BY vin ORDER BY service_date,service_id) AS previous_date\n FROM service_records\n)\nSELECT vin,service_id,previous_date,DATEDIFF(service_date,previous_date) AS gap_days\nFROM compared ORDER BY vin,service_date,service_id;", "cols": ["vin", "service_id", "previous_date", "gap_days"], "rows": [["V1", 1, "NULL", "NULL"], ["V1", 2, "2024-01-11", 30], ["V1", 5, "2024-02-10", 0], ["V2", 3, "NULL", "NULL"], ["V2", 4, "2024-04-02", 10]], "explain": "同日记录用 service_id 明确顺序；NULL 表示没有上次记录，不应替换成零天。", "extra": "增加 LEAD 查看下一次服务时间。"}, {"db": "ev_training_2", "title": "11 · 从销售到首次售后", "topic": "首次记录 / 分母口径", "task": "按每笔销售计算购车当日及之后的首次服务，求这些间隔的平均天数 avg_days，并返回有服务的销售数 serviced_sales。无服务销售不进入平均分母。", "hint": "每笔销售先 MIN 服务日期；再 DATEDIFF，最后 AVG。", "sql": "WITH first_service AS (\n SELECT s.sale_id,s.sale_date,MIN(r.service_date) AS first_date\n FROM sales s LEFT JOIN service_records r\n ON r.vin=s.vin AND r.service_date>=s.sale_date\n GROUP BY s.sale_id,s.sale_date\n)\nSELECT COUNT(first_date) AS serviced_sales,\n ROUND(AVG(DATEDIFF(first_date,sale_date)),2) AS avg_days\nFROM first_service;", "cols": ["serviced_sales", "avg_days"], "rows": [[2, 50.5]], "explain": "V1 为 10 天，V2 为 91 天（2024 年有闰日），平均 50.5 天；V3 无售后不能当作 0 天。此处按销售而非客户加权，样例每车只销售一次。", "extra": "改成每客户等权平均时，应先求客户内平均，再对客户求平均。"}, {"db": "ev_training_2", "title": "12 · 不重复销售额的城市报表", "topic": "先聚合再连接 / 一对多", "task": "输出销售城市 store_city、revenue_wan、service_cost_yuan。服务费用仅统计已售车辆的所有服务，每辆车只归属一个销售城市（本数据满足）；按城市排序。", "hint": "销售与服务分别聚合到城市，再连接。", "sql": "WITH revenue AS (\n SELECT s.store_city,SUM(v.sale_price) AS revenue_wan\n FROM sales s JOIN vehicles v ON v.vin=s.vin GROUP BY s.store_city\n), sold AS (\n SELECT DISTINCT store_city,vin FROM sales\n), costs AS (\n SELECT s.store_city,COALESCE(SUM(r.cost),0) AS service_cost_yuan\n FROM sold s LEFT JOIN service_records r ON r.vin=s.vin GROUP BY s.store_city\n)\nSELECT a.store_city,a.revenue_wan,b.service_cost_yuan\nFROM revenue a JOIN costs b ON b.store_city=a.store_city\nORDER BY a.store_city COLLATE utf8mb4_bin;", "cols": ["store_city", "revenue_wan", "service_cost_yuan"], "rows": [["上海", 20, 200], ["北京", 60, 1300]], "explain": "V1 虽有三次服务，售价仍只算一次；两列保留原有单位，不直接相加。使用 utf8mb4_bin 固定城市展示顺序。", "extra": "若车辆跨城市转售，先明确服务归属时段，不能直接按城市与 VIN 去重分摊。"}, {"db": "coffee_training_2", "title": "13 · 从未卖出的商品", "topic": "NOT EXISTS / 完整产品集", "task": "查出从未产生任何销售记录的 product_id、product_name，按编号排序。", "hint": "以 products 为外层，检查不存在关联销售。", "sql": "SELECT p.product_id,p.product_name FROM products p\nWHERE NOT EXISTS (SELECT 1 FROM sales s WHERE s.product_id=p.product_id)\nORDER BY p.product_id;", "cols": ["product_id", "product_name"], "rows": [[4, "可颂"]], "explain": "无销售是没有匹配记录；不能仅检查 amount=0。", "extra": "改成 2024 年 2 月未售商品，将日期条件放进子查询。"}, {"db": "coffee_training_2", "title": "14 · 高于本店平均交易额", "topic": "相关子查询 / 比较基准", "task": "找出单条 amount 严格高于该门店所有销售记录平均 amount 的交易，输出 sale_id、store_id、amount，按交易编号排序。", "hint": "关联内外层 store_id；这里平均的是销售记录金额，不是每件单价。", "sql": "SELECT s.sale_id,s.store_id,s.amount FROM sales s\nWHERE s.amount>(SELECT AVG(x.amount) FROM sales x WHERE x.store_id=s.store_id)\nORDER BY s.sale_id;", "cols": ["sale_id", "store_id", "amount"], "rows": [[2, 1, 60], [3, 1, 60], [5, 2, 60]], "explain": "北京店均额 45，上海店 55；等于平均值的交易不保留。", "extra": "加入窗口 AVG 写法，对照结果是否相同。"}, {"db": "coffee_training_2", "title": "15 · 每店最近一条销售", "topic": "ROW_NUMBER / 同日决胜", "task": "每个有销售门店取最新记录；日期相同取 sale_id 最大的一条。返回 store_id、sale_id、sale_date、amount，按门店排序。", "hint": "窗口按日期和 ID 双降序，外层筛 rn=1。", "sql": "WITH ranked AS (\n SELECT *,ROW_NUMBER() OVER(PARTITION BY store_id ORDER BY sale_date DESC,sale_id DESC) AS rn\n FROM sales\n)\nSELECT store_id,sale_id,sale_date,amount FROM ranked WHERE rn=1 ORDER BY store_id;", "cols": ["store_id", "sale_id", "sale_date", "amount"], "rows": [[1, 4, "2024-02-01", 20], [2, 6, "2024-03-01", 50]], "explain": "MAX(sale_date) 再回连在同日多行时可能返回多条；ROW_NUMBER 明确一条。", "extra": "只看 1 月，北京店最新是 sale_id=3，上海店是 5。"}, {"db": "coffee_training_2", "title": "16 · 每店收入占全链比例", "topic": "汇总 / 窗口分母", "task": "返回全部门店 store_id、revenue、share_pct；无销售门店收入与占比均为 0。占比保留两位小数，按编号排序。全链无收入时比例为 NULL。", "hint": "先各店汇总，外层 SUM(revenue) OVER() 取得统一分母。", "sql": "WITH totals AS (\n SELECT st.store_id,COALESCE(SUM(s.amount),0) AS revenue\n FROM stores st LEFT JOIN sales s ON s.store_id=st.store_id GROUP BY st.store_id\n)\nSELECT store_id,revenue,ROUND(revenue/NULLIF(SUM(revenue) OVER(),0)*100,2) AS share_pct\nFROM totals ORDER BY store_id;", "cols": ["store_id", "revenue", "share_pct"], "rows": [[1, 180, 62.07], [2, 110, 37.93], [3, 0, 0]], "explain": "分母为 290；如果先过滤门店再算窗口，分母会变成所选门店合计。", "extra": "先算全链分母再筛北京店，验证占比仍为 62.07%。"}, {"db": "coffee_training_2", "title": "17 · 类别收入横向展示", "topic": "条件聚合 / 零值", "task": "每店一行输出 store_id、coffee_revenue、pastry_revenue，含零销售门店；按编号排序。分类值为“咖啡”“糕点”。", "hint": "关联商品后，用 SUM(CASE WHEN ... THEN amount ELSE 0 END)。", "sql": "SELECT st.store_id,\n SUM(CASE WHEN p.category='咖啡' THEN s.amount ELSE 0 END) AS coffee_revenue,\n SUM(CASE WHEN p.category='糕点' THEN s.amount ELSE 0 END) AS pastry_revenue\nFROM stores st LEFT JOIN sales s ON s.store_id=st.store_id\nLEFT JOIN products p ON p.product_id=s.product_id\nGROUP BY st.store_id ORDER BY st.store_id;", "cols": ["store_id", "coffee_revenue", "pastry_revenue"], "rows": [[1, 180, 0], [2, 60, 50], [3, 0, 0]], "explain": "不要用 COUNT(CASE ... ELSE 0 END) 计算次数，更不能把次数当金额。", "extra": "增加各类别售出数量列，比较数量与金额的差异。"}, {"db": "coffee_training_2", "title": "18 · 最近三笔移动平均", "topic": "ROWS / 明细保留", "task": "按每店 sale_date、sale_id 升序，求当前及前两笔交易金额的平均值 avg_last3，保留两位小数。输出 store_id、sale_id、amount、avg_last3，按同样顺序展示。", "hint": "ROWS BETWEEN 2 PRECEDING AND CURRENT ROW；起始不足三条按实际条数平均。", "sql": "SELECT store_id,sale_id,amount,\n ROUND(AVG(amount) OVER(PARTITION BY store_id ORDER BY sale_date,sale_id\n ROWS BETWEEN 2 PRECEDING AND CURRENT ROW),2) AS avg_last3\nFROM sales ORDER BY store_id,sale_date,sale_id;", "cols": ["store_id", "sale_id", "amount", "avg_last3"], "rows": [[1, 1, 40, 40], [1, 2, 60, 50], [1, 3, 60, 53.33], [1, 4, 20, 46.67], [2, 5, 60, 60], [2, 6, 50, 55]], "explain": "这是最近三笔记录，不是最近三天；第一笔窗口只有自己。", "extra": "改成日粒度并补齐日期，再计算三日移动平均。"}, {"db": "ev_training_2", "title": "19 · 车型内的售价档位", "topic": "DENSE_RANK / 并列", "task": "为全部车辆按车型分区，按售价降序计算 price_rank。返回 vin、model、sale_price、price_rank，按 VIN 排序。", "hint": "排名窗口只按售价排序，不加入 VIN；外层再按 VIN 展示。", "sql": "SELECT vin,model,sale_price,\n DENSE_RANK() OVER(PARTITION BY model ORDER BY sale_price DESC) AS price_rank\nFROM vehicles ORDER BY vin;", "cols": ["vin", "model", "sale_price", "price_rank"], "rows": [["V1", "Model S", 30, 1], ["V2", "iX3", 20, 1], ["V3", "Model S", 30, 1], ["V4", "NIO ET7", 40, 1]], "explain": "同车型同价并列为 1；窗口并列规则与输出顺序分别指定。", "extra": "将 V3 售价改为 31 后，它排名 1，V1 排名 2；在副本库验证。"}, {"db": "ev_training_2", "title": "20 · 车型维修成本与覆盖", "topic": "条件聚合 / 分母", "task": "按车型输出 model、repair_events、repaired_vehicles、avg_repair_cost；包含无维修车型，平均每次维修成本为 NULL。按二进制车型名排序，成本单位元。", "hint": "COUNT 条件分支不写 ELSE 0；车辆数用条件 DISTINCT。", "sql": "SELECT v.model,\n COUNT(CASE WHEN r.service_type='维修' THEN r.service_id END) AS repair_events,\n COUNT(DISTINCT CASE WHEN r.service_type='维修' THEN v.vin END) AS repaired_vehicles,\n ROUND(AVG(CASE WHEN r.service_type='维修' THEN r.cost END),2) AS avg_repair_cost\nFROM vehicles v LEFT JOIN service_records r ON r.vin=v.vin\nGROUP BY v.model ORDER BY v.model COLLATE utf8mb4_bin;", "cols": ["model", "repair_events", "repaired_vehicles", "avg_repair_cost"], "rows": [["Model S", 1, 1, 1000], ["NIO ET7", 0, 0, "NULL"], ["iX3", 0, 0, "NULL"]], "explain": "免费软件升级不进入维修的次数、车辆数或均值分母。", "extra": "新增同车第二次维修，维修次数增加，但维修车辆数不增加。"}, {"db": "ev_training_2", "title": "21 · 标记首次服务", "topic": "ROW_NUMBER / CASE", "task": "输出 vin、service_id、is_first，首次服务标记 1，其余 0；每车按 service_date、service_id 确定顺序，最终也按此顺序排列。", "hint": "内层排名，外层 CASE；每个 VIN 单独重启序号。", "sql": "WITH ranked AS (\n SELECT *,ROW_NUMBER() OVER(PARTITION BY vin ORDER BY service_date,service_id) AS rn\n FROM service_records\n)\nSELECT vin,service_id,CASE WHEN rn=1 THEN 1 ELSE 0 END AS is_first\nFROM ranked ORDER BY vin,service_date,service_id;", "cols": ["vin", "service_id", "is_first"], "rows": [["V1", 1, 1], ["V1", 2, 0], ["V1", 5, 0], ["V2", 3, 1], ["V2", 4, 0]], "explain": "每车只有一条首次；同日多条通过 service_id 打破并列。", "extra": "如果业务要求“首次服务日全部记录”，应先取最早日期，而不是强制一条。"}, {"db": "ev_training_2", "title": "22 · 每车服务成本累计", "topic": "SUM 窗口 / 同日记录", "task": "输出 vin、service_id、cost、running_cost，累计到当前服务记录，按 VIN、日期、服务 ID 排序；费用单位元。", "hint": "显式 ROWS，日期相同再按服务 ID，保证逐条累计。", "sql": "SELECT vin,service_id,cost,\n SUM(cost) OVER(PARTITION BY vin ORDER BY service_date,service_id\n ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_cost\nFROM service_records ORDER BY vin,service_date,service_id;", "cols": ["vin", "service_id", "cost", "running_cost"], "rows": [["V1", 1, 300, 300], ["V1", 2, 1000, 1300], ["V1", 5, 0, 1300], ["V2", 3, 200, 200], ["V2", 4, 0, 200]], "explain": "零元服务保留明细但不增加累计费用；不同车辆累计独立。", "extra": "要求当日全部累计值相同，应先按车辆与日期汇总。"}, {"db": "ev_training_2", "title": "23 · 多次购车客户", "topic": "GROUP BY / HAVING", "task": "查询至少有两条销售记录的客户 customer_id、name、purchase_count、revenue_wan，按客户编号排序。每条销售记录视为一笔购车。", "hint": "先连接客户、销售和车辆，再按客户分组，HAVING COUNT(*)>=2。", "sql": "SELECT c.customer_id,c.name,COUNT(*) AS purchase_count,SUM(v.sale_price) AS revenue_wan\nFROM customers c JOIN sales s ON s.customer_id=c.customer_id\nJOIN vehicles v ON v.vin=s.vin\nGROUP BY c.customer_id,c.name HAVING COUNT(*)>=2 ORDER BY c.customer_id;", "cols": ["customer_id", "name", "purchase_count", "revenue_wan"], "rows": [[1, "张伟", 2, 60]], "explain": "客户张伟有两笔销售，分别对应 V1 和 V3；不要连接售后明细导致购车次数放大。", "extra": "若一条销售可撤销，先定义有效销售条件再聚合。"}, {"db": "ev_training_2", "title": "24 · 已售但从未维修的车辆", "topic": "NOT EXISTS / 人群定义", "task": "输出已售车辆 vin、model，包括做过保养或升级但从未维修的车辆，按 VIN 排序。未售车辆不返回。", "hint": "同时要求存在销售且不存在维修服务，不是不存在任何服务。", "sql": "SELECT v.vin,v.model FROM vehicles v\nWHERE EXISTS (SELECT 1 FROM sales s WHERE s.vin=v.vin)\nAND NOT EXISTS (\n SELECT 1 FROM service_records r WHERE r.vin=v.vin AND r.service_type='维修'\n) ORDER BY v.vin;", "cols": ["vin", "model"], "rows": [["V2", "iX3"], ["V3", "Model S"]], "explain": "V2 做过保养与升级但没有维修；V3 没有任何售后也符合；V4 未售，不在人群中。", "extra": "改成已售且从未进行任何售后，结果只应剩 V3。"}];
function renderLab(){ $('#lab').innerHTML=`<div class="panel" style="margin-bottom:18px"><h2>两套业务数据，二十四个分析任务</h2><p>根据两份综合实战笔记，保留表名与核心字段，另编小规模边界数据：咖啡店 12 题 + 新能源汽车 12 题。数据包含零销售、缺失月份、同日服务和三个月边界；不是笔记原始全量数据。先写 SQL，再核对预期表格。</p><p class="muted">本页是离线编辑与自查练习，不连接 MySQL，也不会执行或自动验证 SQL。下载脚本后，在 MySQL 8.0.16+ 的独立练习库中运行；脚本创建 coffee_training_2 与 ev_training_2 两个数据库，不会自动删表。实战完成状态为你自行确认。</p><button id="dataset" class="primary">下载建表与样例数据 .sql</button> <button id="solutions">下载参考解法 .sql</button><details><summary>查看表结构与全部样例数据</summary><pre>${esc(DATA_SQL)}</pre></details></div>`+CASES.map((c,i)=>`<article class="case"><div class="qmeta"><span class="chip">实战 ${i+1} / 24</span><span>${esc(c.topic)}</span>${i>=12?'<span class="chip">新增</span>':''}</div><h2>${esc(c.title)}</h2><p class="muted">练习库：<code>${esc(c.db)}</code> · 先执行 USE ${esc(c.db)};</p><p>${esc(c.task)}</p><textarea data-draft="${i}" aria-label="实战 ${i+1} SQL 草稿" spellcheck="false" placeholder="先独立写出 SQL，草稿会自动保存…">${esc(state.drafts[i]||'')}</textarea><details><summary>给我一点提示</summary><p>${esc(c.hint)}</p></details><details><summary>参考解法、预期结果与边界检查</summary><pre>${esc(c.sql)}</pre><div class="tablewrap"><table><thead><tr>${c.cols.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>${esc(c.explain)}</p><p class="muted">加练：${esc(c.extra)}</p></details><label><input type="checkbox" data-case="${i}" ${state.cases[i]?'checked':''}> 我已在 MySQL 运行核对，并能解释边界情况（自评）</label></article>`).join('');$('#dataset').onclick=()=>download('sql-training-2-data.sql',DATA_SQL,'text/plain');$('#solutions').onclick=()=>download('sql-training-2-solutions.sql',CASES.map((c,i)=>'USE '+c.db+';\n-- '+(i+1)+'. '+c.title+'\n'+c.sql).join('\n\n'),'text/plain');$('#lab').querySelectorAll('[data-draft]').forEach(el=>el.oninput=()=>{state.drafts[el.dataset.draft]=el.value;save();});$('#lab').querySelectorAll('[data-case]').forEach(el=>el.onchange=()=>{state.cases[el.dataset.case]=el.checked;save();});}
function renderReview(){const hist=Object.values(state.history),errors=hist.reduce((n,h)=>n+h.errors,0),due=BANK.filter(q=>state.history[q.id]?.due<=Date.now()).length;$('#review').innerHTML=`<div class="panel"><h2>把错题变成下一次的优势</h2><p>累计提交 ${hist.reduce((n,h)=>n+h.attempts,0)} 次 · 未匹配/答错 ${errors} 次 · 到期复习 ${due} 题 · 实战自评完成 ${Object.values(state.cases).filter(Boolean).length} / 24</p><p class="muted">答对后按连续正确次数安排 1 / 3 / 7 / 14 天复习；答错后 1 天。修改答案不删除历史。正确率仅统计客观题；实战完成由你运行核对后自评。</p><button id="duego" class="primary">练习到期题目</button> <button id="wronggo">练习当前错题</button></div><h2>知识点覆盖</h2><div class="reviewgrid">${[...new Set(BANK.map(q=>q.topic))].map(t=>{const qs=BANK.filter(q=>q.topic===t),n=qs.filter(q=>state.graded[q.id]).length,r=qs.filter(q=>state.graded[q.id]&&right(q)).length;return `<div class="panel"><div class="reviewrow"><strong>${esc(t)}</strong><span class="muted">答对 ${r} / ${qs.length}</span></div><div class="progress"><i style="width:${r/qs.length*100}%"></i></div><span class="muted">已提交 ${n} 题${n?' · 正确率 '+Math.round(r/n*100)+'%':' · 尚未开始'}</span></div>`;}).join('')}</div><div class="notice" style="margin-top:18px">毕业检查：不看答案写完 24 个实战；解释 NULL、并列、无匹配、数据重复；用自己的 MySQL 查看执行计划；能解释报表的粒度、单位与时间边界。参考笔记：单表查询.md、多表查询.md、MySQL函数.md、MySQL索引和函数.md、day08_数据分析综合实战1.md、day08_数据分析综合实战2.md。</div>`;for(const [id,f] of [['duego','due'],['wronggo','wrong']])$('#'+id).onclick=()=>{topic='all';filter=f;query='';$('#filter').value=f;$('#search').value='';applyFilter();switchTab('quiz');};}
setInterval(()=>{if(!document.hidden){state.seconds++;updateStats();if(state.seconds%15===0)save();}},1000);window.addEventListener('pagehide',save);
render();renderLab();status(storageOK?'第二册已就绪：120 道专项题、24 道实战。进度独立保存，不影响 1.html。':'无法读取本地记录，当前使用临时进度。请定期导出备份。');
</script></body></html>
